name: tell-me-why
channels:
  - fastai
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - fastcore
  - matplotlib
  - numpy<2
  - scikit-learn
  - seaborn
  - pip
  - pip:
      - torch==2.11.0
      - torchvision==0.26.0
      - torchaudio==2.11.0
      - fastai==2.8.7
      - nbdev>=3.0
      - pytorch-msssim>=1.0
      - ipykernel>=6.0
      - pytest>=7.0
