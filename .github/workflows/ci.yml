name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  nbdev:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Check nbdev notebooks and exports
        run: nbdev-prepare

      - name: Run tests
        run: pytest -q
