project:
  type: website
  resources:
    - images/**

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    keep-md: true
  commonmark: default

website:
  twitter-card: true
  open-graph: true
  favicon: images/logo_square.png
  repo-actions: [issue]
  navbar:
    background: primary
    logo: images/logo_square.png
    search: true
  sidebar:
    style: floating

metadata-files: [nbdev.yml, sidebar.yml]